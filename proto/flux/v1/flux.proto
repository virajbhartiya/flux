// flux gRPC API, v1 (SPEC §8).
//
// Phase 1 surface. Services are split by cacheability: ObjectService serves
// only immutable, content-addressed objects and is answered identically by
// every tier (fluxd, flux-cache, flux-server).
//
// Conventions:
//   * All ids are raw 32-byte BLAKE3 hashes (`bytes`), git hashes are 20 bytes.
//   * Paths are raw bytes ('/'-separated, see SPEC §3.1).
//   * Batch RPCs stream results in arbitrary order, each tagged with its id.

syntax = "proto3";

package flux.v1;

// ───────────────────────────── Common ─────────────────────────────

message Timestamp {
  int64 unix_ms = 1;
  int32 tz_offset_min = 2;
}

enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_REGULAR = 1;
  FILE_KIND_EXECUTABLE = 2;
  FILE_KIND_SYMLINK = 3;
  FILE_KIND_GITLINK = 4;
}

message CopyFrom {
  bytes path = 1;
  uint32 parent_index = 2;
}

message FileChange {
  bytes path = 1;
  // Unset (empty) content_id together with deleted=true means deletion.
  bool deleted = 2;
  bytes content_id = 3;
  uint64 size = 4;
  FileKind kind = 5;
  bytes gitlink_sha1 = 6;      // only for FILE_KIND_GITLINK
  CopyFrom copy_from = 7;      // optional
  // Merges only: keep parents[0]'s value (the parents disagree here).
  bool retain = 8;
  // Nonzero: a regular file with this non-canonical git mode (e.g. 0100664),
  // preserved for git fidelity. `kind` then holds the canonical kind.
  uint32 git_mode = 9;
}

message Changeset {
  repeated bytes parents = 1;
  bytes author = 2;
  Timestamp author_time = 3;
  optional bytes committer = 4;
  Timestamp committer_time = 5;  // present iff committer is
  bytes message = 6;
  repeated FileChange file_changes = 7;
  map<string, bytes> extra = 8;
}

message ChangesetInfo {
  bytes id = 1;
  uint64 generation = 2;
  bytes root_tree = 3;
  int64 log_seq = 4;
  // Canonical CBOR encoding; hashing it yields `id` (SPEC §2.3).
  bytes canonical = 5;
  Changeset changeset = 6;
  bytes git_sha1 = 7;            // empty if not mapped
}

// ─────────────────────────── ObjectService ───────────────────────────

service ObjectService {
  // Fetch trees by id. With depth > 0 the tier also streams descendant trees
  // up to `depth` levels, restricted to `sparse_prefixes` when set.
  rpc GetTrees(GetTreesRequest) returns (stream TreeObject);
  // Fetch file contents. Each content is streamed as ordered frames.
  rpc GetContents(GetContentsRequest) returns (stream ContentFrame);
  rpc GetContentMeta(GetContentMetaRequest) returns (stream ContentMetaResult);
}

message GetTreesRequest {
  string repo = 1;
  repeated bytes tree_ids = 2;
  uint32 depth = 3;
  // Directory prefixes (e.g. "src/app"); descendants outside them are not
  // expanded. Ancestors of a prefix are always expanded.
  repeated bytes sparse_prefixes = 4;
  // Path of tree_ids[0]; required when depth > 0 and sparse_prefixes is set.
  bytes path_hint = 5;
}

message TreeObject {
  bytes id = 1;
  bytes path = 2;        // best-effort, set when expanded via depth
  bytes canonical = 3;   // canonical CBOR; hash(canonical) == id
}

message GetContentsRequest {
  string repo = 1;
  repeated bytes content_ids = 2;
}

message ContentFrame {
  bytes content_id = 1;
  uint64 offset = 2;
  bytes data = 3;
  bool last = 4;
}

message GetContentMetaRequest {
  string repo = 1;
  repeated bytes content_ids = 2;
}

message ContentMetaResult {
  bytes content_id = 1;
  bool found = 2;
  uint64 size = 3;
  bytes git_sha1 = 4;
  bytes sha256 = 5;
  bool is_binary = 6;
}

// ─────────────────────────── RepoService ───────────────────────────

service RepoService {
  // Resolve a revision expression: ref name, cs_<hex>/hex prefix, git:<sha>,
  // optionally followed by ~N (first-parent ancestor) or ^N (Nth parent).
  rpc ResolveRev(ResolveRevRequest) returns (ChangesetInfo);
  rpc ListRefs(ListRefsRequest) returns (ListRefsResponse);
  rpc GetChangesets(GetChangesetsRequest) returns (stream ChangesetInfo);
  // Ancestors of `rev` in descending generation order.
  rpc Log(LogRequest) returns (stream ChangesetInfo);
  rpc ListDir(ListDirRequest) returns (ListDirResponse);
  rpc ReadFile(ReadFileRequest) returns (stream ContentFrame);
  rpc Diff(DiffRequest) returns (stream DiffEntry);
  // Batch map git commit SHA-1s to changeset ids (empty bytes if unknown).
  rpc GitLookup(GitLookupRequest) returns (GitLookupResponse);
  // Line-level attribution of a file.
  rpc Blame(BlameRequest) returns (BlameResponse);
  // Ancestry between two revisions: is_ancestor, merge base, ahead/behind.
  rpc Ancestry(AncestryRequest) returns (AncestryResponse);
  // Regex search over the files of a revision (no checkout needed).
  rpc Search(SearchRequest) returns (stream SearchMatch);
  // All file paths of a revision (for fuzzy finders), optionally filtered.
  rpc FindFiles(FindFilesRequest) returns (FindFilesResponse);
  // The changeset that last modified each entry of a directory.
  rpc LastModified(LastModifiedRequest) returns (LastModifiedResponse);
}

message BlameRequest {
  string repo = 1;
  string rev = 2;
  bytes path = 3;
}

message BlameRange {
  uint32 start_line = 1;   // 0-based
  uint32 line_count = 2;
  bytes changeset_id = 3;
}

message BlameResponse {
  repeated BlameRange ranges = 1;
  // Changesets referenced by ranges (deduplicated).
  repeated ChangesetInfo changesets = 2;
}

message AncestryRequest {
  string repo = 1;
  string a = 2;
  string b = 3;
}

message AncestryResponse {
  bool a_is_ancestor_of_b = 1;
  bool b_is_ancestor_of_a = 2;
  bytes merge_base = 3;  // empty if none
  uint64 a_ahead = 4;    // in a, not in b
  uint64 b_ahead = 5;    // in b, not in a
}

message SearchRequest {
  string repo = 1;
  string rev = 2;
  string pattern = 3;
  bool regex = 4;          // otherwise a literal
  bool case_insensitive = 5;
  bytes path_prefix = 6;
  uint32 limit = 7;        // max matches (default 500)
}

message SearchMatch {
  bytes path = 1;
  uint32 line_number = 2;  // 1-based
  bytes line = 3;
}

message FindFilesRequest {
  string repo = 1;
  string rev = 2;
  string query = 3;        // fuzzy query; empty = all
  uint32 limit = 4;
}

message FindFilesResponse {
  repeated bytes paths = 1;
}

message LastModifiedRequest {
  string repo = 1;
  string rev = 2;
  bytes path = 3;          // directory; empty = root
}

message LastModifiedEntry {
  bytes name = 1;
  bytes changeset_id = 2;
}

message LastModifiedResponse {
  repeated LastModifiedEntry entries = 1;
  repeated ChangesetInfo changesets = 2;
}

message GitLookupRequest {
  string repo = 1;
  repeated bytes git_sha1s = 2;
}

message GitLookupResponse {
  repeated bytes changeset_ids = 1;  // parallel to request
}

message ResolveRevRequest {
  string repo = 1;
  string rev = 2;
}

message ListRefsRequest {
  string repo = 1;
  bytes prefix = 2;
  uint32 limit = 3;
}

message RefEntry {
  bytes name = 1;
  bytes target = 2;
  uint64 version = 3;
}

message ListRefsResponse {
  repeated RefEntry refs = 1;
}

message GetChangesetsRequest {
  string repo = 1;
  repeated bytes ids = 2;
}

message LogRequest {
  string repo = 1;
  string rev = 2;
  uint32 limit = 3;
  bool first_parent = 4;
  // Only changesets that modified this path (file or dir).
  bytes path = 5;
  // Exclude ancestors of these revisions (git's `hide..rev`).
  repeated string hide = 6;
  uint32 skip = 7;
}

message TreeEntryInfo {
  bytes name = 1;
  bool is_dir = 2;
  FileKind kind = 3;
  bytes id = 4;
  uint64 size = 5;
  uint64 descendant_files = 6;
}

message ListDirRequest {
  string repo = 1;
  string rev = 2;
  bytes path = 3;   // empty = root
}

message ListDirResponse {
  bytes tree_id = 1;
  repeated TreeEntryInfo entries = 2;
}

message ReadFileRequest {
  string repo = 1;
  string rev = 2;
  bytes path = 3;
}

message DiffRequest {
  string repo = 1;
  string old_rev = 2;  // empty = first parent of new_rev
  string new_rev = 3;
  bytes path_prefix = 4;
}

message DiffFile {
  FileKind kind = 1;
  bytes content_id = 2;
  uint64 size = 3;
}

message DiffEntry {
  bytes path = 1;
  DiffFile old = 2;  // unset = added
  DiffFile new = 3;  // unset = deleted
}

// ─────────────────────────── WriteService ───────────────────────────

service WriteService {
  rpc HasContents(HasContentsRequest) returns (HasContentsResponse);
  // Client-streamed upload of one or more contents, each as consecutive
  // frames ending with last=true. The server re-hashes and verifies.
  rpc UploadContents(stream UploadFrame) returns (UploadResponse);
  rpc CreateChangeset(CreateChangesetRequest) returns (ChangesetInfo);
  // Batch create: changesets are applied in order and may use earlier batch
  // members as parents. One transaction per batch (importers, agents).
  rpc CreateChangesets(CreateChangesetsRequest) returns (CreateChangesetsResponse);
  // Pipelined batch create for bulk imports: one response per request, in
  // order. The server validates and derives batch k+1 while batch k
  // commits, so later batches may name changesets of earlier, still
  // in-flight ones as parents. The first failure ends the stream; batches
  // answered before it are durable. Every request names the same repo.
  rpc CreateChangesetsStream(stream CreateChangesetsRequest) returns (stream CreateChangesetsResponse);
  rpc UpdateRef(UpdateRefRequest) returns (UpdateRefResponse);
  rpc PutGitMapping(PutGitMappingRequest) returns (PutGitMappingResponse);
  // Land a stack (all ancestors of `rev` not yet in `target_ref`) on the
  // target: fast-forward, or a server-side rebase (SPEC §7.3) with
  // line-level three-way merges, then a compare-and-swap of the ref.
  rpc Land(LandRequest) returns (LandResponse);
}

message LandRequest {
  string repo = 1;
  string rev = 2;
  string target_ref = 3;
  string reason = 4;
}

message LandResponse {
  bytes new_head = 1;
  // Rebased changesets, oldest first (empty for a fast-forward).
  repeated bytes rebased = 2;
  bool fast_forward = 3;
  uint32 merged_files = 4;  // files resolved by three-way merge
}

message HasContentsRequest {
  string repo = 1;
  repeated bytes content_ids = 2;
}

message HasContentsResponse {
  repeated bool present = 1;  // parallel to request ids
}

message UploadFrame {
  string repo = 1;          // required on the first frame
  bytes content_id = 2;     // client-computed id, required on each content's first frame
  bytes data = 3;
  bool last = 4;
  // Total content size, on each content's first frame. Required for content
  // larger than 4 MiB (streamed into chunks without buffering).
  optional uint64 size = 5;
  // Optional hint on the first frame: a previous version of the same path.
  // The server may store this content as a delta against it.
  bytes delta_base = 6;
}

message UploadResponse {
  repeated ContentMetaResult stored = 1;
}

message CreateChangesetRequest {
  string repo = 1;
  Changeset changeset = 2;
}

message CreateChangesetsRequest {
  string repo = 1;
  repeated Changeset changesets = 2;
  // Optional, parallel to `changesets`: the git commit each one was
  // imported from (recorded like PutGitMapping, in the same call).
  repeated bytes git_sha1s = 3;
  // Return only id, generation, root_tree and log_seq per changeset (the
  // caller already has the changesets; bulk imports).
  bool ids_only = 4;
}

message CreateChangesetsResponse {
  repeated ChangesetInfo changesets = 1;
}

message UpdateRefRequest {
  string repo = 1;
  bytes name = 2;
  oneof expect {
    bool any = 3;
    bool absent = 4;
    uint64 version = 5;
    bytes target = 6;
  }
  bytes new_target = 7;  // empty = delete the ref
  string reason = 8;
}

message UpdateRefResponse {
  bool updated = 1;
  uint64 version = 2;
  RefEntry current = 3;  // on mismatch
}

message GitMapping {
  bytes changeset_id = 1;
  bytes git_sha1 = 2;
}

message PutGitMappingRequest {
  string repo = 1;
  repeated GitMapping mappings = 2;
}

message PutGitMappingResponse {}

// ─────────────────────────── ReviewService ───────────────────────────

service ReviewService {
  rpc CreateReview(CreateReviewRequest) returns (Review);
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);
  rpc GetReview(GetReviewRequest) returns (ReviewDetail);
  // Comment, approve, close, reopen or point the review at a new head.
  rpc UpdateReview(UpdateReviewRequest) returns (Review);
  rpc LandReview(LandReviewRequest) returns (LandResponse);
}

message Review {
  int64 number = 1;
  string title = 2;
  string body = 3;
  string author = 4;
  bytes head = 5;
  string target = 6;
  string state = 7;     // open | landed | closed
  bytes landed = 8;
  int64 created_ms = 9;
  int64 updated_ms = 10;
}

message ReviewEvent {
  string kind = 1;      // comment | approved | updated | landed | closed | reopened
  string author = 2;
  string body = 3;
  bytes changeset_id = 4;
  bytes path = 5;
  int64 line = 6;
  int64 ts_ms = 7;
}

message CreateReviewRequest {
  string repo = 1;
  string title = 2;
  string body = 3;
  string head_rev = 4;
  string target = 5;    // default "main"
}

message ListReviewsRequest {
  string repo = 1;
  string state = 2;     // empty = all
  uint32 limit = 3;
}

message ListReviewsResponse {
  repeated Review reviews = 1;
}

message GetReviewRequest {
  string repo = 1;
  int64 number = 2;
}

message ReviewDetail {
  Review review = 1;
  repeated ReviewEvent events = 2;
  // Changesets in the review (head not in target), newest first.
  repeated ChangesetInfo stack = 3;
}

message UpdateReviewRequest {
  string repo = 1;
  int64 number = 2;
  string action = 3;    // comment | approve | close | reopen | update
  string body = 4;
  string head_rev = 5;  // for update
}

message LandReviewRequest {
  string repo = 1;
  int64 number = 2;
}

// ─────────────────────────── EventService ───────────────────────────

service EventService {
  // Stream repository events as they happen (ref moves, new changesets,
  // review activity).
  rpc Watch(WatchRequest) returns (stream RepoEvent);
}

message WatchRequest {
  string repo = 1;      // empty = all repositories
}

message RepoEvent {
  string repo = 1;
  string kind = 2;      // ref | changesets | review | issue | comment | status | release | ci
  bytes ref_name = 3;
  bytes old = 4;
  bytes new = 5;
  string actor = 6;
  uint64 count = 7;
  int64 review = 8;
  string detail = 9;
}

// ─────────────────────────── AuthService ───────────────────────────

service AuthService {
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  // Exchange a username (or email) and password for a new API token.
  rpc Login(LoginRequest) returns (LoginResponse);
}

message WhoAmIRequest {}

message LoginRequest {
  string login = 1;     // username or email
  string password = 2;
  string label = 3;     // e.g. "flux CLI on laptop"
  string scopes = 4;    // read | write | all (default all)
  uint32 expires_days = 5; // 0 = never
  string otp = 6;       // two-factor code, when the account has 2FA on
}

message LoginResponse {
  string token = 1;
  string user = 2;
}

message WhoAmIResponse {
  string user = 1;      // empty = anonymous
  bool is_admin = 2;
  bool can_write = 3;
  string auth_mode = 4; // open | token | private
}

// ─────────────────────────── AdminService ───────────────────────────

service AdminService {
  rpc CreateRepo(CreateRepoRequest) returns (RepoInfo);
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
}

message CreateRepoRequest {
  // `name` (server-wide, admins only) or `owner/name` (a user's own, or an
  // organization they own).
  string name = 1;
  // public | internal | private (default: private for owned repositories).
  string visibility = 2;
}

message RepoInfo {
  string name = 1;
}

message ListReposRequest {}

message ListReposResponse {
  repeated RepoInfo repos = 1;
}
