# Production-shaped stack: Postgres metadata + S3-compatible blobs (MinIO).
#   docker compose up -d
#   docker compose exec flux flux-server token --user admin --admin
#   open http://localhost:7878
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux
      POSTGRES_DB: flux
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "flux"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: flux
      MINIO_ROOT_PASSWORD: fluxflux123
    volumes: [minio:/data]
    ports: ["9001:9001"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 flux fluxflux123; do sleep 1; done;
                  mc mb -p local/flux; mc version enable local/flux"

  flux:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    environment:
      FLUX_META_URL: postgres://flux:flux@postgres:5432/flux
      FLUX_BLOB_URL: s3://flux/objects
      FLUX_AUTH: token
      FLUX_PUBLIC_URL: ${FLUX_PUBLIC_URL:-http://localhost:7878}
      FLUX_SSH_LISTEN: 0.0.0.0:2222
      AWS_ENDPOINT: http://minio:9000
      AWS_ALLOW_HTTP: "true"
      AWS_ACCESS_KEY_ID: flux
      AWS_SECRET_ACCESS_KEY: fluxflux123
      AWS_REGION: us-east-1
      RUST_LOG: info
    # Keys (secrets key, SSH host key) live here; losing them makes stored
    # CI secrets and 2FA enrollments unreadable.
    volumes: [flux:/var/lib/flux]
    ports: ["7878:7878", "2222:2222"]
    restart: unless-stopped

volumes:
  pg: {}
  minio: {}
  flux: {}
