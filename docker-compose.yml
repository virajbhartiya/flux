# Production-shaped stack: Postgres metadata + S3-compatible blobs.
#   docker compose up -d
#   docker compose exec flux flux-server token --user admin --admin
#   open http://localhost:7878
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux
      POSTGRES_DB: flux
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "flux"]
      interval: 5s
      retries: 20

  # S3-compatible object storage (Versity Gateway on a local volume). In
  # production, point FLUX_BLOB_URL at S3, R2 or GCS instead.
  s3:
    image: versity/versitygw:v1.9.0
    command: posix /data
    environment:
      ROOT_ACCESS_KEY: flux
      ROOT_SECRET_KEY: fluxflux123
    volumes: [s3:/data]

  s3-init:
    image: amazon/aws-cli:2.38.1
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: flux
      AWS_SECRET_ACCESS_KEY: fluxflux123
      AWS_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "until aws --endpoint-url http://s3:7070 s3 ls >/dev/null 2>&1; do sleep 1; done;
                  aws --endpoint-url http://s3:7070 s3 mb s3://flux 2>&1 | grep -v BucketAlready || true"

  flux:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    environment:
      FLUX_META_URL: postgres://flux:flux@postgres:5432/flux
      FLUX_BLOB_URL: s3://flux/objects
      FLUX_AUTH: token
      FLUX_PUBLIC_URL: ${FLUX_PUBLIC_URL:-http://localhost:7878}
      FLUX_SSH_LISTEN: 0.0.0.0:2222
      AWS_ENDPOINT: http://s3:7070
      AWS_ALLOW_HTTP: "true"
      AWS_ACCESS_KEY_ID: flux
      AWS_SECRET_ACCESS_KEY: fluxflux123
      AWS_REGION: us-east-1
      RUST_LOG: info
    # Keys (secrets key, SSH host key) live here; losing them makes stored
    # CI secrets and 2FA enrollments unreadable.
    volumes: [flux:/var/lib/flux]
    ports: ["7878:7878", "2222:2222"]
    restart: unless-stopped

volumes:
  pg: {}
  s3: {}
  flux: {}
