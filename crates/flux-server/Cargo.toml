[package]
name = "flux-server"
description = "flux authoritative server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "flux-server"
path = "src/main.rs"

[dependencies]
flux-core.workspace = true
flux-store.workspace = true
flux-derive.workspace = true
flux-proto.workspace = true
anyhow.workspace = true
blake3.workspace = true
similar = "2"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
flux-client.workspace = true
axum = { version = "0.8", features = ["http1", "http2", "tokio", "query", "form"] }
maud = "0.27"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "parsing", "regex-onig"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "compression-zstd"] }
serde.workspace = true
serde_json.workspace = true
diffy = "0.4"
getrandom = "0.3"
argon2 = "0.5"
hex.workspace = true
rayon = "1"
regex = "1"
sha2.workspace = true
sha1.workspace = true
flate2 = "1"
base64 = "0.22"
bytes.workspace = true
zstd.workspace = true
clap.workspace = true
futures.workspace = true
moka.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
reqwest.workspace = true
serde_yaml.workspace = true
hmac = "0.12"
chacha20poly1305 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
russh = "0.63.1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
