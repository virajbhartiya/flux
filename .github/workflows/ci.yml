name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: flux
          POSTGRES_DB: flux_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p flux-store --test conformance
        env:
          FLUX_TEST_POSTGRES_URL: postgres://postgres:flux@localhost:5432/flux_test

  fuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fuse3
      - run: cargo build --release -p flux-cli -p flux-server
      - run: ci/fuse-test.sh
        env:
          BIN: target/release

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and boot the compose stack (Postgres + S3)
        run: |
          docker compose up -d --build
          for i in $(seq 60); do curl -fsS http://localhost:7878/-/readyz && break; sleep 2; done
          curl -fsS http://localhost:7878/-/readyz
          docker compose exec -T flux flux-server token --user admin --admin
          # The metadata really lives in Postgres.
          docker compose exec -T postgres psql -U flux -tAc "select count(*) from users" | grep -qx 1
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
